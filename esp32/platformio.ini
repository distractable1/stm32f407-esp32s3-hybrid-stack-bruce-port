[platformio]
default_envs = usbhat-bench

[env:usbhat-bench]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -D HAT_VBUS_ENABLE_PIN=-1
monitor_speed = 115200
lib_extra_dirs = ../dependencies
lib_deps = LovyanGFX
lib_ldf_mode = deep+

[env:usbhat-display-check]
extends = env:usbhat-bench
build_flags = ${env:usbhat-bench.build_flags} -DHAT_DISPLAY_TEST
