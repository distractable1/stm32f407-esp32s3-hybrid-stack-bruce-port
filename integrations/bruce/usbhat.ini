[env:usbhat-bruce]
extends = env:esp32-s3-devkitc-1-psram
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/USBHAT>
build_unflags =
    -DUSB_as_HID=1
    -DUSE_CC1101_VIA_SPI
    -DARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE=1
    -DROTATION=1
build_flags =
    ${env:esp32-s3-devkitc-1-psram.build_flags}
    -Iboards/USBHAT
    -DHAT_REMOTE_DISPLAY
    -DHAS_SCREEN
    -DHAS_TOUCH
    -DUSE_LOVYANGFX
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=182
    -DROTATION=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DHAT_VBUS_ENABLE_PIN=-1
lib_deps =
    ${env.lib_deps}
    LovyanGFX
lib_ldf_mode = chain
